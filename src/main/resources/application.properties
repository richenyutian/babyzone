spring.application.name=BabySteps
server.port=${PORT:8080}

app.data-root=${APP_DATA_ROOT:./data}
app.uploads-directory=uploads
app.config-directory=config
app.config-file-name=app-config.properties
app.session-attribute=BABY_STEPS_AUTHENTICATED

spring.datasource.url=jdbc:sqlite:${app.data-root}/baby-steps.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
