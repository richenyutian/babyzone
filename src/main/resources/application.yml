spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/blog.db
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  thymeleaf:
    cache: false

server:
  port: 8080

upload:
  path: ./uploads

admin:
  username: admin
  password: admin123
