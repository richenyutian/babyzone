<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F9FAFB] text-[#333] min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-md bg-white border border-slate-200 rounded-xl p-8">
    <h1 class="text-2xl font-semibold mb-6 text-center">后台登录</h1>
    <p th:if="${error}" class="text-red-500 text-sm mb-4" th:text="${error}"></p>
    <form method="post" action="/admin/login" class="space-y-5">
        <div>
            <label class="block text-sm mb-2">用户名</label>
            <input name="username" required class="w-full border border-slate-300 rounded-lg px-4 py-2" />
        </div>
        <div>
            <label class="block text-sm mb-2">密码</label>
            <input type="password" name="password" required class="w-full border border-slate-300 rounded-lg px-4 py-2" />
        </div>
        <button class="w-full px-4 py-2 rounded-lg bg-slate-900 text-white">登录</button>
    </form>
</div>
</body>
</html>
